org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# Día 61 — el build de release chocó dos veces seguidas por falta de
# memoria nativa (native memory allocation mmap failed) con el daemon
# persistente pidiendo hasta 4G de heap + 1G de metaspace. Se bajó el
# límite y se desactivó el daemon persistente (org.gradle.daemon=false)
# para este build de producción -- arranca un poco más lento (sin
# reusar un proceso ya "calentado"), pero cada build es un proceso
# nuevo y limpio, sin arrastrar memoria de intentos anteriores.
org.gradle.daemon=false
org.gradle.parallel=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
